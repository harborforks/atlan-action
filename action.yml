name: "Atlan Action"
description: "Whenever you update a dbt model or data contract, Atlan adds downstream lineage impact context directly in pull requests."
author: "Atlan"

inputs:
  GITHUB_TOKEN:
    description: "GitHub token"
    required: true
  ATLAN_API_TOKEN:
    description: "Atlan API token"
    required: true
  ATLAN_INSTANCE_URL:
    description: "Atlan instance URL"
    required: true
  DBT_ENVIRONMENT_BRANCH_MAP:
    description: "List of environments"
    required: false
  IGNORE_MODEL_ALIAS_MATCHING:
    description: "Ignore model alias matching"
    required: false
    default: "false"
  DBT_CONNECTION_QUALIFIED_NAME:
    description: "Look models up only in this dbt connection, for example default/dbt/1706648562"
    required: false
  ATLAN_CONFIG:
    description: "Atlan CLI config file location"
    required: false
runs:
  using: "node24"
  main: "dist/index.js"

branding:
  icon: activity
  color: blue
